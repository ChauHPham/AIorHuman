services:
  - type: web
    name: ai-art-detector
    env: python
    buildCommand: pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements-cpu.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.18
      - key: FLASK_ENV
        value: production

